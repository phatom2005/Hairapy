name: "CodeQL Analysis"

# Advanced setup — thay cho Default setup cua GitHub.
# Ly do 1: Default setup tu auto-detect ngon ngu trong repo, thay project/mobile/ios
# va project/mobile/macos (Xcode project do `flutter create` tu sinh, khong phai
# code Swift do team viet) nen tu them "Swift" vao job quet -> luon fail.
# Ly do 2: autobuild cua CodeQL cho Java khong tu tim ra pom.xml vi day la monorepo
# (backend nam trong project/backend/, khong o root repo) -> phai build thu cong
# bang Maven, giong het cach main.yml dang lam (working-directory: project/backend).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21 (cho job java-kotlin)
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build backend (Java) trong CodeQL trace
        if: matrix.language == 'java-kotlin'
        working-directory: project/backend
        run: mvn -B clean install -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
