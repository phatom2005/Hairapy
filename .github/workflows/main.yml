name: Hairapy CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Test & Build Backend
  # ─────────────────────────────────────────
  backend:
    name: Backend — Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run backend tests
        working-directory: project/backend
        run: mvn test

      - name: Build backend JAR
        working-directory: project/backend
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: project/backend/target/*.jar
          retention-days: 1

  # ─────────────────────────────────────────
  # JOB 2: Test & Build Frontend
  # ─────────────────────────────────────────
  frontend:
    name: Frontend — Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: project/frontend/package-lock.json

      - name: Install dependencies
        working-directory: project/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: project/frontend
        run: npm run test --if-present

      - name: Build frontend
        working-directory: project/frontend
        run: npm run build

  # ─────────────────────────────────────────
  # JOB 3: Security Scan (Snyk)
  # ─────────────────────────────────────────
  security:
    name: Security — Snyk Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/maven@master
        continue-on-error: true        # Không block pipeline nếu Snyk lỗi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=project/backend/pom.xml

  # ─────────────────────────────────────────
  # JOB 4: Build & Push Docker Images
  # ─────────────────────────────────────────
  docker:
    name: Docker — Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./project/backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hairapy-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./project/frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hairapy-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max