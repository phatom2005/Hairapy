spring.application.name=hairapy

# Server
server.port=8080

# PostgreSQL
# Mac dinh: Postgres local trong docker-compose (service "db").
# Deploy: set DB_URL/DB_USERNAME qua env var (vd: Supabase Session Pooler) de override, khong sua code.
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/hairapy_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP - Supabase free tier Session Pooler gioi han 15 connections
# Giu pool nho de tranh EMAXCONNSESSION khi Railway restart nhieu lan
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA
# validate: Flyway la nguon chan ly schema duy nhat, tranh drift khi dung song song voi ddl-auto=update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Sentry
# Bug goc: sentry.dsn=${SENTRY_DSN:} default ve "" (chuoi rong) thay vi thuc su
# khong ton tai. docker-compose cung forward SENTRY_DSN= (rong) vao container du
# .env khong set gi. SentryAutoConfiguration$HubConfiguration.sentryHub goi
# Sentry.init("") -> io.sentry.Dsn parse chuoi rong -> "Invalid DSN scheme: null".
# Fix chac chan nhat: loai han SentryAutoConfiguration ra khoi context bang
# spring.autoconfigure.exclude khi CHUA co DSN thuc (mac dinh = loai bo).
# Khi nao co Sentry project thuc (chua urgent voi MVP nay): set 2 env var
# SENTRY_DSN=<dsn thuc> va SENTRY_AUTOCONFIG_EXCLUDE= (de rong) de bat lai Sentry.
spring.autoconfigure.exclude=${SENTRY_AUTOCONFIG_EXCLUDE:io.sentry.spring.boot.jakarta.SentryAutoConfiguration}
sentry.traces-sample-rate=1.0

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
