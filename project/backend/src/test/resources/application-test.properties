# Server
server.port=8081

# H2 Database Config for Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Disable Flyway for tests
spring.flyway.enabled=false

# Redis Config for testing (defaults to localhost, but we won't interact with it much)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT test configuration
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1oYWlyYXB5LXRlc3RpbmctdXNlLW9ubHk=
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173

# Exclude Sentry to avoid invalid DSN warnings
spring.autoconfigure.exclude=io.sentry.spring.boot.jakarta.SentryAutoConfiguration
sentry.dsn=
