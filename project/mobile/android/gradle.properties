org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Fix: Kotlin incremental compiler bi loi "this and base files have different roots"
# khi project (o dia E:) va Pub cache (o dia C:) nam khac o dia tren Windows.
# Day la bug cua Kotlin Gradle plugin khi tinh duong dan tuong doi giua 2 o dia
# khac nhau. Tat incremental compilation de tranh crash (build cham hon xiu
# nhung on dinh).
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
